<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure File Sharing</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f4f6fb; color: #222; padding: 40px; }
      .card { max-width: 520px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 18px 40px rgba(0,0,0,0.08); padding: 32px; }
      h1 { margin-top: 0; }
      a.button { display:inline-block; margin-top:16px; text-decoration:none; background:#3239ff; color:#fff; padding:14px 20px; border-radius:10px; }
      p.note { font-size: 14px; color: #555; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Secure File Sharing</h1>
      <p class="note">Create an account to upload files, share them with other users, and download files you are authorized to access.</p>
      <a class="button" href="/register">Register</a>
      <a class="button" href="/login">Login</a>
    </div>
  </body>
</html>
