<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Security Share - Secure File Sharing</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        background: white;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .hero {
        max-width: 700px;
        text-align: center;
        color: #222;
      }

      h1 {
        font-size: 4rem;
        font-weight: 700;
        margin-bottom: 20px;
        letter-spacing: -2px;
      }

      .subtitle {
        font-size: 1.2rem;
        font-weight: 300;
        margin-bottom: 50px;
        line-height: 1.6;
        color: #555;
      }

      .button-group {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
      }

      a.button {
        display: inline-block;
        padding: 16px 40px;
        font-size: 1.1rem;
        font-weight: 600;
        text-decoration: none;
        border-radius: 50px;
        transition: all 0.3s ease;
        border: 2px solid #222;
      }

      a.button.primary {
        background: #222;
        color: white;
      }

      a.button.primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      a.button.secondary {
        background: white;
        color: #222;
      }

      a.button.secondary:hover {
        background: #f5f5f5;
        transform: translateY(-2px);
      }

      @media (max-width: 600px) {
        h1 {
          font-size: 2.5rem;
        }

        .subtitle {
          font-size: 1rem;
        }

        .button-group {
          flex-direction: column;
        }

        a.button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <h1>Security Share</h1>
      <p class="subtitle">Share your files with confidence using AES-256 Encryption. Protect your data using password-protected transfers and authorized user access.</p>
      <div class="button-group">
        <a class="button primary" href="/register">Create Account</a>
        <a class="button secondary" href="/login">Sign-in</a>
      </div>
    </div>
  </body>
</html>
