<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Security Share</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        background: white;
        color: #222;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        width: 100%;
        max-width: 420px;
      }

      .card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        padding: 48px 40px;
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .subtitle {
        font-size: 0.95rem;
        color: #666;
        margin-bottom: 32px;
      }

      form {
        display: flex;
        flex-direction: column;
      }

      label {
        display: block;
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 8px;
        color: #222;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        margin-bottom: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.2s;
      }

      input:focus {
        outline: none;
        border-color: #222;
      }

      button {
        width: 100%;
        background: #222;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover {
        background: #333;
      }

      .footer {
        text-align: center;
        margin-top: 24px;
        font-size: 0.9rem;
        color: #666;
      }

      .footer a {
        color: #222;
        text-decoration: none;
        font-weight: 600;
      }

      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to access your secure files</p>
        <form method="POST" action="/login">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required />
          
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
          
          <button type="submit">Sign in</button>
        </form>
        <p class="footer">Don't have an account? <a href="/register">Create Account</a></p>
      </div>
    </div>
  </body>
</html>
